# Portão antes da produção: push na main é deploy no Railway, então todo PR e todo push na main
# passam por lint, typecheck, testes, build e os e2e da API contra um Postgres de verdade.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test

      - run: pnpm turbo run build

  api-e2e:
    name: E2E da API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Mesma versão maior de produção (docs/deploy/railway.md).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jottape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jottape_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Os pacotes exportam de dist/, e o e2e recria o banco com as migrations.
      - run: pnpm turbo run build --filter=api^...

      - run: pnpm --filter api exec prisma generate

      - run: pnpm --filter api test:e2e
