<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Jottape</title>
    <script>
      // Aplica o tema antes do bundle carregar, senão a tela pisca clara no modo escuro. Mesma
      // chave e mesmos valores do next-themes, que assume daqui em diante
      // (src/components/theme-provider.tsx).
      (function () {
        var salvo = null;
        try {
          salvo = localStorage.getItem('theme');
        } catch (e) {
          // Armazenamento bloqueado: segue o sistema.
        }
        var escuro =
          salvo === 'dark' ||
          (salvo !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', escuro);
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
